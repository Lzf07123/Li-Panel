<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="description" content="一次收藏，触达所有常用入口" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6fbf9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#3a3f45" />
    <title>Li&Panel</title>
    <script>
      (function () {
        var key = "lipanel-theme";
        var stored = null;
        try {
          stored = localStorage.getItem(key);
        } catch (e) {}
        var dark =
          stored === "dark" ||
          ((stored === null || stored === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
