[project]
name = "lipanel-backend"
version = "0.1.0"
description = "Li&Panel 后端：个人网页快捷方式面板"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "PyJWT>=2.9",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
