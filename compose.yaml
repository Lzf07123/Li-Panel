services:
  lipanel:
    build:
      context: .
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.io/library}
        PANEL_PORT: ${PANEL_PORT:-8000}
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: lipanel:local
    container_name: lipanel
    ports:
      - "${PANEL_PORT:-8000}:${PANEL_PORT:-8000}"
    environment:
      PANEL_DATA_DIR: /app/data
      PANEL_PORT: ${PANEL_PORT:-8000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PANEL_SECRET_KEY: ${PANEL_SECRET_KEY:?请在 .env 中设置 PANEL_SECRET_KEY}
      PANEL_PUBLIC_MODE: ${PANEL_PUBLIC_MODE:-true}
      PANEL_COOKIE_SECURE: ${PANEL_COOKIE_SECURE:-false}
      PANEL_SESSION_DAYS: ${PANEL_SESSION_DAYS:-30}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
