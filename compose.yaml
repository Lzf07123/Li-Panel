services:
  # 一次性初始化：确保 ./data 属主为容器用户 10001（appuser），
  # Linux 部署时若目录由 root 创建，lipanel 无写权限会报 unable to open database file。
  data-init:
    image: ${IMAGE_REGISTRY:-docker.io/library}/alpine:3.20
    container_name: lipanel-data-init
    restart: "no"
    volumes:
      - ./data:/data
    command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data"]

  lipanel:
    build:
      context: .
      args:
        IMAGE_REGISTRY: ${IMAGE_REGISTRY:-docker.io/library}
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        VITE_APP_NAME: ${VITE_APP_NAME:-}
        VITE_APP_TAGLINE: ${VITE_APP_TAGLINE:-}
        VITE_ICP_FILING_TEXT: ${VITE_ICP_FILING_TEXT:-}
        VITE_ICP_FILING_URL: ${VITE_ICP_FILING_URL:-}
        VITE_ICP_FILING_ICON: ${VITE_ICP_FILING_ICON:-}
        VITE_POLICE_FILING_TEXT: ${VITE_POLICE_FILING_TEXT:-}
        VITE_POLICE_FILING_URL: ${VITE_POLICE_FILING_URL:-}
        VITE_POLICE_FILING_ICON: ${VITE_POLICE_FILING_ICON:-}
    image: lipanel:local
    container_name: lipanel
    depends_on:
      data-init:
        condition: service_completed_successfully
    # 后端固定监听容器内 8000，不直接暴露主机；对外统一由 nginx 反代（隐藏真实端口）
    environment:
      PANEL_DATA_DIR: /app/data
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PANEL_SECRET_KEY: ${PANEL_SECRET_KEY:?请在 .env 中设置 PANEL_SECRET_KEY}
      PANEL_PUBLIC_MODE: ${PANEL_PUBLIC_MODE:-true}
      PANEL_COOKIE_SECURE: ${PANEL_COOKIE_SECURE:-false}
      PANEL_SESSION_DAYS: ${PANEL_SESSION_DAYS:-30}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      PANEL_LINK_ICON_FETCH: ${PANEL_LINK_ICON_FETCH:-true}
      PANEL_BACKUP_KEEP: ${PANEL_BACKUP_KEEP:-10}
      PANEL_HEALTH_CHECK: ${PANEL_HEALTH_CHECK:-true}
      PANEL_SSO_LOGOUT_REDIRECTS: ${PANEL_SSO_LOGOUT_REDIRECTS:-}
      PANEL_ALLOWED_HOSTS: ${PANEL_ALLOWED_HOSTS:-}
      PANEL_LOGIN_MAX_FAILS: ${PANEL_LOGIN_MAX_FAILS:-5}
      PANEL_LOGIN_LOCK_MINUTES: ${PANEL_LOGIN_LOCK_MINUTES:-15}
      PANEL_HSTS: ${PANEL_HSTS:-false}
      PANEL_HOST_COOKIE: ${PANEL_HOST_COOKIE:-false}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  nginx:
    image: ${IMAGE_REGISTRY:-docker.io/library}/nginx:alpine
    container_name: lipanel-nginx
    depends_on:
      - lipanel
    ports:
      - "${PANEL_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
